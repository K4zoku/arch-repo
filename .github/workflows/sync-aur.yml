name: Sync AUR Packages
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages.txt'

permissions:
  actions: write
  contents: write

concurrency:
  group: package-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Validate packages.txt exists
        run: |
          if [[ ! -f packages.txt ]]; then
            echo "::error::packages.txt not found at repo root"
            exit 1
          fi

      - name: Sync package branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p /tmp/aur-clone
          SYNCED=()
          FAILED=()
          REMOVED=()
          CHANGED=false
          UNCHANGED=()

          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            entry="$(echo "$raw_line" | sed 's/#.*//' | xargs)"
            [[ -z "$entry" ]] && continue
            [[ "$entry" == local:* ]] && {
              echo "Skipping local package: ${entry#local:}"
              continue
            }

            pkg="$entry"
            AUR_SOURCE="https://aur.archlinux.org/$pkg.git"
            GITHUB_MIRROR="https://github.com/archlinux/aur.git"
            source="$AUR_SOURCE"
            if ! source_head=$(git ls-remote "$source" HEAD 2>/tmp/clone.log | awk 'NR == 1 { print $1 }'); then
              echo "$pkg: AUR lookup failed; checking GitHub mirror"
              source="$GITHUB_MIRROR"
              if ! source_head=$(git ls-remote "$source" "refs/heads/$pkg" 2>/tmp/clone.log | awk 'NR == 1 { print $1 }'); then
                echo "::warning::Could not resolve $pkg from AUR or GitHub mirror"
                cat /tmp/clone.log
                FAILED+=("$pkg")
                continue
              fi
            fi

            target_head=$(git ls-remote "$TARGET" "refs/heads/$pkg" 2>/tmp/target-ls-remote.log | awk 'NR == 1 { print $1 }') || target_head=""
            if [[ -n "$source_head" && "$source_head" == "$target_head" ]]; then
              echo "$pkg is up to date."
              UNCHANGED+=("$pkg")
              continue
            fi

            mirror="/tmp/aur-clone/$pkg.git"
            rm -rf "$mirror"

            echo "Cloning $pkg from ${source#https://}..."
            if [[ "$source" == "$AUR_SOURCE" ]]; then
              if ! git clone -q --mirror "$source" "$mirror" 2>/tmp/clone.log; then
                echo "$pkg: AUR clone failed; trying GitHub mirror"
                source="$GITHUB_MIRROR"
                if ! git clone -q --bare --single-branch --branch "$pkg" "$source" "$mirror" 2>/tmp/clone.log; then
                  echo "::warning::Clone failed for $pkg"
                  cat /tmp/clone.log
                  FAILED+=("$pkg")
                  continue
                fi
              fi
            elif ! git clone -q --bare --single-branch --branch "$pkg" "$source" "$mirror" 2>/tmp/clone.log; then
              echo "::warning::Clone failed for $pkg"
              cat /tmp/clone.log
              FAILED+=("$pkg")
              continue
            fi

            git -C "$mirror" push "$TARGET" "HEAD:refs/heads/$pkg" --force
            git -C "$mirror" push "$TARGET" --tags --force || true
            CHANGED=true
            SYNCED+=("$pkg")
            echo "Updated package branch $pkg"
          done < packages.txt

          mapfile -t KEEP < <(
            sed 's/#.*//' packages.txt | awk '{print $1}' | sed 's/^local://' | grep -v '^$'
          )
          while read -r ref; do
            [[ "$ref" == "main" ]] && continue
            if ! printf '%s\n' "${KEEP[@]}" | grep -q -x "$ref"; then
              if git push "$TARGET" --delete "$ref"; then
                REMOVED+=("$ref")
                CHANGED=true
                echo "Pruned obsolete package branch $ref"
              else
                echo "::warning::Failed to prune obsolete package branch $ref"
              fi
            fi
          done < <(git ls-remote --heads "$TARGET" | awk '{print $2}' | sed 's#refs/heads/##')

          if [[ "$CHANGED" == "true" ]]; then
            if gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" --ref main; then
              echo "Dispatched build workflow from changed package branches."
            else
              echo "::warning::Failed to dispatch build workflow."
            fi
          else
            echo "No package branches changed; skipping build workflow."
          fi

          {
            echo "### Sync summary"
            echo "- Synced: ${SYNCED[*]:-none}"
            echo "- Unchanged: ${UNCHANGED[*]:-none}"
            echo "- Failed: ${FAILED[*]:-none}"
            echo "- Pruned: ${REMOVED[*]:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
