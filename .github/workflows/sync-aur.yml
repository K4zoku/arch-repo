name: Sync AUR Packages
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aur-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate packages.txt exists
        run: |
          if [[ ! -f packages.txt ]]; then
            echo "::error::packages.txt not found at repo root"
            exit 1
          fi

      - name: Sync packages, branches and prune removed
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/aur-clone
          TARGET="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          SYNCED=()
          FAILED=()
          REMOVED=()

          mapfile -t VALID_PKGS < <(sed 's/#.*//' packages.txt | awk '{print $1}' | grep -v '^$' | sed 's/^local://')

          for dir in */ ; do
            [[ -e "$dir" ]] || continue
            dir="${dir%/}"
            case "$dir" in
              .github) continue ;;
            esac
            if ! printf '%s\n' "${VALID_PKGS[@]}" | grep -q -x "$dir"; then
              echo "Removing obsolete package directory: $dir"
              rm -rf "$dir"
              REMOVED+=("$dir")
            fi
          done

          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            entry="$(echo "$raw_line" | sed 's/#.*//' | xargs)"
            [[ -z "$entry" ]] && continue
            [[ "$entry" == local:* ]] && {
              echo "Skipping local package: ${entry#local:}"
              continue
            }

            pkg="$entry"
            mirror="/tmp/aur-clone/$pkg.git"
            rm -rf "$mirror"

            echo "Cloning $pkg from AUR..."
            if ! git clone -q --mirror "https://aur.archlinux.org/$pkg.git" \
                    "$mirror" 2>/tmp/clone.log; then
              echo "$pkg: AUR clone failed; trying GitHub mirror"
              if ! git clone -q --bare --single-branch --branch "$pkg" \
                      "https://github.com/archlinux/aur.git" "$mirror" 2>/tmp/clone.log; then
                echo "::warning::Clone failed for $pkg"
                cat /tmp/clone.log
                FAILED+=("$pkg")
                continue
              fi
            fi

            echo "Syncing files for $pkg from package mirror"
            mkdir -p "$pkg"
            find "$pkg" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            git -C "$mirror" archive --format=tar HEAD | tar -x -C "$pkg"
            SYNCED+=("$pkg")

            git -C "$mirror" push "$TARGET" "HEAD:refs/heads/$pkg" --force
            git -C "$mirror" push "$TARGET" --tags --force || true
            echo "Updated package branch $pkg"
          done < packages.txt

          mapfile -t KEEP < <(
            sed 's/#.*//' packages.txt | awk '{print $1}' | sed 's/^local://' | grep -v '^$'
          )
          while read -r ref; do
            case "$ref" in
              main|aur-sync) continue ;;
            esac
            if ! printf '%s\n' "${KEEP[@]}" | grep -q -x "$ref"; then
              git push origin --delete "$ref" || true
              echo "Pruned obsolete package branch $ref"
            fi
          done < <(git ls-remote --heads origin | awk '{print $2}' | sed 's#refs/heads/##')

          echo "synced=${SYNCED[*]}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED[*]}" >> "$GITHUB_OUTPUT"
          echo "removed=${REMOVED[*]}" >> "$GITHUB_OUTPUT"

          echo "### Sync summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synced: ${SYNCED[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: ${FAILED[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removed: ${REMOVED[*]:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update aggregated pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(aur-sync): sync package sources and prune deletions'
          branch: aur-sync
          delete-branch: true
          title: 'AUR sync: cập nhật và dọn dẹp source packages'
          labels: aur-sync
          body: |
            ### 🔄 AUR Synchronization Report

            Hệ thống tự động đã thực hiện kiểm tra và đồng bộ hóa các gói từ AUR.

            | Trạng thái | Gói phần mềm |
            | :--- | :--- |
            | 🟢 **Synced Successfully** | `${{ steps.sync.outputs.synced || 'none' }}` |
            | 🔴 **Failed to Sync** | `${{ steps.sync.outputs.failed || 'none' }}` |
            | 🧹 **Pruned / Removed** | `${{ steps.sync.outputs.removed || 'none' }}` |

            ---
            *Vui lòng kiểm tra trạng thái verify build bên dưới trước khi thực hiện merge.*
